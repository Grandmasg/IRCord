[general]
# Standard-Ausgabesprache für Chat-Nachrichten: "de" (Deutsch), "nl" (Niederländisch), "en" (Englisch), "fr" (Französisch), "es" (Spanisch)
language = "de"

# Erkannte Befehls-Präfixe im Chat (z.B. !hilfe, .help, ?wetter, $zeit)
command_prefixes = ["!", "."]

# Bot-Besitzer Identifikatoren für geschützte Administrationsbefehle
bot_owner_discord_id = 0
bot_owner_irc_nick = "Kuuke"

# Web-Dashboard / Health-Check HTTP-Port
http_port = 9090

# Pastebin-Schwellenwert: Antworten mit mehr Zeilen als dieser Wert werden via Pastebin oder aufgeteilt gesendet
pastebin_threshold_lines = 4

# Administrator-Protokollkanäle
admin_channel_irc = "#bot-logs"
admin_channel_discord_id = 0 # Optional: Discord-Kanal-ID für #bot-logs

[bridge]
# Anti-Loop-Timeout in Sekunden, um Nachrichten-Echos zwischen IRC und Discord zu verhindern
loop_prevent_timeout_sec = 10

# In-Memory LRU-Cache-Kapazität für Nachrichten-Tracking und Deduplizierung
lru_cache_capacity = 2000

# Discord-Präsenzstatus (online/abwesend/nicht stören) mit IRC synchronisieren
sync_presence = true

# Bearbeitete und gelöschte Discord-Nachrichten direkt mit IRC synchronisieren
sync_edits = true

# Kanal-Matrix-Zuordnungen (Multi-Channel)
# Definiere einen [[channels]]-Block für jedes verknüpfte Paar aus IRC-Kanal und Discord-Kanal
[[channels]]
irc_channel = "#allgemein"
discord_channel_id = 123456789012345678
discord_webhook_url = "https://discord.com/api/webhooks/..."
# Optionale kanalspezifische Sprache: überschreibt [general].language für diesen Kanal
# (Die persönliche Spracheinstellung eines Nutzers via '!sprache' oder '!lang' hat stets höchste Priorität)
# language = "de"

# [[channels]]
# irc_channel = "#english"
# discord_channel_id = 987654321098765432
# discord_webhook_url = "https://discord.com/api/webhooks/..."
# language = "en"

# WhatPulse Plugin-Einstellungen ("Team de Apen")
[whatpulse]
team_name = "Team de Apen"
# Offizielle WhatPulse Web-API v1 (siehe https://whatpulse.org/help/api/web/intro)
# Erfordert WHATPULSE_API_KEY in .env
# Oder verwende optional eine eigene Team-Feed-URL, z.B. "https://www.grandmasg.nl/WPNEW/api.php"
api_url = "https://whatpulse.org/api/v1"
poll_interval_seconds = 180
cache_ttl_seconds = 300

# Lokale AI / LLM-Einstellungen (OpenAI-kompatibler Endpunkt, z.B. FlashML, Ollama oder LocalAI)
[ai]
base_url = "http://127.0.0.1:1919/v1"
default_model = "default"
max_tokens = 300
temperature = 0.7
sliding_window_size = 8
hourly_token_budget = 50000

# Moderation & Flood-Schutz
[moderation]
irc_flood_delay_ms = 800
irc_line_max_bytes = 380
raid_threshold_joins_per_sec = 5
raid_mute_duration_sec = 60

# Open-Meteo Wetter-API Quota Governor (proaktive Ratenbegrenzung vor Überschreitung)
[open_meteo]
daily_limit = 9500     # Open-Meteo kostenloses Limit liegt bei 10.000 Aufrufen/Tag (Sicherheitsstopp bei 9.500)
hourly_limit = 4500    # Limit liegt bei 5.000 Aufrufen/Stunde (Sicherheitsstopp bei 4.500)
minutely_limit = 500   # Limit liegt bei 600 Aufrufen/Minute (Sicherheitsstopp bei 500)
