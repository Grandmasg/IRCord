[general]
# Default chat output language: "en" (English), "nl" (Dutch), "de" (German), "fr" (French), "es" (Spanish), "zh" (Chinese)
language = "en"

# Recognized command prefixes in chat (e.g. !help, .help, ?help, $help)
command_prefixes = ["!", "."]

# Bot owner identifiers for restricted admin commands
bot_owner_discord_id = 0
bot_owner_irc_nick = "YourNick"

# Verified identity (IMPORTANT): a bare nick can be taken over by anyone. Set the NickServ/SASL account of the owner;
# the bot then requires the server-confirmed account (IRCv3 account-tag) instead of just the nick.
bot_owner_irc_account = ""
# Extra operators besides the owner (confirmed IRC accounts and Discord user IDs)
operator_irc_accounts = []
operator_discord_ids = []
# Moderators may kick/ban/voice/topic, but not op/deop or manage plugins
moderator_irc_accounts = []
moderator_discord_ids = []

# Address the HTTP server binds to (use "127.0.0.1" behind a reverse proxy)
http_bind = "0.0.0.0"

# Web dashboard / health check HTTP port
http_port = 9090

# Pastebin threshold: responses longer than this number of lines are uploaded to pastebin (or sent as multiple messages)
pastebin_threshold_lines = 4

# Upload long Discord messages (> pastebin_threshold_lines) to dpaste.org instead of truncating them for IRC.
# PRIVACY: the text is sent to a third-party service (free, no key). Default off = messages are truncated.
pastebin_enabled = false

# Admin logging channels
admin_channel_irc = "#bot-logs"
admin_channel_discord_id = 0 # Optional: Discord channel ID for #bot-logs

[bridge]
# Anti-loop timeout in seconds to prevent message echoes between IRC and Discord
loop_prevent_timeout_sec = 10

# In-memory LRU cache capacity for message tracking and deduplication
lru_cache_capacity = 2000

# Synchronize Discord user presence (online/idle/dnd) to IRC
sync_presence = true

# Synchronize Discord message edits and deletions to IRC
sync_edits = true

# Multi-channel matrix mappings
# Define one [[channels]] block for each bridged pair of IRC channel and Discord channel
[[channels]]
irc_channel = "#general"
discord_channel_id = 123456789012345678
discord_webhook_url = "https://discord.com/api/webhooks/..."
# disabled_plugins = ["urban"] # plugins uitgeschakeld in dit kanaal / disabled in this channel
# Optional channel-specific language: overrides [general].language for this channel
# (User preferences set via '!lang' take highest priority)
# language = "en"

# [[channels]]
# irc_channel = "#dutch"
# discord_channel_id = 987654321098765432
# discord_webhook_url = "https://discord.com/api/webhooks/..."
# language = "nl"

# WhatPulse Plugin Settings ("Deapen")
[whatpulse]
team_name = "Deapen"
# Official WhatPulse Web API v1 (see https://whatpulse.org/help/api/intro)
# Supports personal Bearer tokens from https://whatpulse.org/go/settings-api-keys
# Single key:
# api_key = "your_whatpulse_api_key_here"
# Or multiple keys for automatic round-robin rotation (1,000 req/hr per key):
# api_keys = ["key_1", "key_2"]
# Or set via WHATPULSE_API_KEY in .env or docker-compose (supports comma-separated "key1,key2")
# Optional local Client API URL (e.g. running on port 3490 on localhost or LAN):
# client_url = "http://localhost:3490/v1/account-totals"
api_url = "https://whatpulse.org/api/v1"
poll_interval_seconds = 180
cache_ttl_seconds = 300

# Local AI / LLM Settings (OpenAI-compatible endpoint, e.g., FlashML, Ollama, LocalAI)
[ai]
base_url = "http://127.0.0.1:1919/v1"
default_model = "default"
max_tokens = 300
temperature = 0.7
sliding_window_size = 8
hourly_token_budget = 50000

# Moderation & Flood Protection
[moderation]
irc_flood_delay_ms = 800
irc_line_max_bytes = 380
raid_threshold_joins_per_sec = 5
raid_mute_duration_sec = 60
# Max. expensive commands (!ai, !tr, !http, !dns, ...) per user per minute; 0 = unlimited. Operators are exempt.
expensive_commands_per_minute = 6

# Open-Meteo Weather API Quota Governor (proactive rate limiter)
[open_meteo]
daily_limit = 9500     # Open-Meteo free limit is 10,000 calls/day (safety cut-off at 9,500)
hourly_limit = 4500    # Limit is 5,000 calls/hour (safety cut-off at 4,500)
minutely_limit = 500   # Limit is 600 calls/minute (safety cut-off at 500)
