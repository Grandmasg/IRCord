    # Pronoms
    "je", "tu", "il", "ils", "elle", "elles", "on", "nous", "vous", "me", "te", "se",
    "moi", "toi", "lui", "eux", "qui", "que", "quoi", "dont", "où", "ou",
    # Verbes courants & formes parlées
    "est", "sont", "suis", "es", "sommes", "êtes", "etes", "été", "ete", "être", "etre",
    "avoir", "ai", "as", "a", "avons", "avez", "ont",
    "faire", "fais", "fait", "fai", "faisons", "faites", "font",
    "aller", "vais", "vas", "va", "allons", "allez", "vont",
    "dire", "dis", "dit", "disons", "dites", "disent",
    "voir", "vois", "voit", "voyons", "voyez", "voient", "vu",
    "savoir", "sais", "sait", "savons", "savez", "savent",
    "pouvoir", "peux", "peut", "pouvons", "pouvez", "peuvent",
    "vouloir", "veux", "veut", "voulons", "voulez", "veulent",
    "devoir", "dois", "doit", "devons", "devez", "doivent",
    "venir", "viens", "vient", "venons", "venez", "viennent",
